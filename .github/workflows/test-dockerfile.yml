 
name: build Dockerfile

on:
  push:
    paths:
      - 'Dockerfile'
      - '.github/workflows/test-dockerfile.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.github/workflows/test-dockerfile.yml'

jobs:
  build:
   runs-on: ubuntu-26.04
  
   steps:
     - uses: actions/checkout@v5
     - name: Build Docker image 
       run: docker build -t firo .

