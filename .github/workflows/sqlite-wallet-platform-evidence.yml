name: SQLite Wallet Platform Evidence

on:
  push:
    branches:
      - 'dev/navidr/sqlite-wallet'

permissions:
  contents: read

concurrency:
  group: sqlite-wallet-platform-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mingw-wallet-tests:
    name: Build MinGW SQLite wallet tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MinGW build tools
        run: |
          set -exo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            automake \
            binutils-mingw-w64-x86-64 \
            build-essential \
            ccache \
            cmake \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            libtool \
            meson \
            mingw-w64-common \
            mingw-w64-x86-64-dev \
            ninja-build \
            pkg-config \
            unzip \
            wget

      - name: Select POSIX MinGW runtime
        run: |
          set -exo pipefail
          sudo update-alternatives --set \
            x86_64-w64-mingw32-gcc \
            /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set \
            x86_64-w64-mingw32-g++ \
            /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Configure build parallelism and ccache
        run: |
          set -exo pipefail
          EVIDENCE_JOBS=$(nproc)
          if [ "$EVIDENCE_JOBS" -gt 20 ]; then
            EVIDENCE_JOBS=20
          fi
          echo "EVIDENCE_JOBS=$EVIDENCE_JOBS" >> "$GITHUB_ENV"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: Cache deterministic dependencies
        uses: actions/cache@v5
        with:
          path: |
            depends/built
            depends/sources
            depends/work
          key: sqlite-wallet-evidence-mingw-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/hosts/*.mk', 'depends/builders/*.mk', 'depends/Makefile', 'depends/funcs.mk', 'depends/toolchain.cmake.in') }}
          restore-keys: |
            sqlite-wallet-evidence-mingw-
            depends-windows-x86_64-w64-mingw32-

      - name: Download scoped MinGW dependencies
        run: |
          set -exo pipefail
          rm -rf depends/sources/download-stamps
          attempt=1
          max=5
          until make -C depends download-one \
              HOST=x86_64-w64-mingw32 \
              NO_QT=1 \
              NO_QR=1 \
              NO_ZMQ=1; do
            if [ "$attempt" -ge "$max" ]; then
              echo "MinGW dependency download failed after $attempt attempts"
              exit 1
            fi
            sleep "$((attempt * 5))"
            attempt=$((attempt + 1))
          done

      - name: Fix MinGW headers
        shell: bash
        run: |
          set -euxo pipefail
          MINGW_INC="/usr/x86_64-w64-mingw32/include"
          if ! grep -q \
              "NLM_INTERNET_CONNECTIVITY_WEBHIJACK" \
              "$MINGW_INC/netlistmgr.h"; then
            sudo bash -c "cat >> '$MINGW_INC/netlistmgr.h' <<'EOF'

          #ifndef NLM_INTERNET_CONNECTIVITY_WEBHIJACK
          #define NLM_INTERNET_CONNECTIVITY_WEBHIJACK 0x1
          #endif
          EOF"
          fi

      - name: Build dual BDB and SQLite wallet tests
        run: |
          set -exo pipefail
          HOST_TRIPLET=x86_64-w64-mingw32
          make -C depends -j"$EVIDENCE_JOBS" \
            HOST="$HOST_TRIPLET" \
            NO_QT=1 \
            NO_QR=1 \
            NO_ZMQ=1

          SQLITE_HEADER="depends/$HOST_TRIPLET/include/sqlite3.h"
          SQLITE_ARCHIVE="depends/$HOST_TRIPLET/lib/libsqlite3.a"
          test -e "$SQLITE_HEADER"
          test -e "$SQLITE_ARCHIVE"
          grep -Eq \
            '^#define[[:space:]]+SQLITE_VERSION[[:space:]]+"3\.50\.4"$' \
            "$SQLITE_HEADER"
          grep -q '#define SQLITE_VERSION_NUMBER 3050004' "$SQLITE_HEADER"
          grep -q \
            '4d8adfb30e03f9cf27f800a2c1ba3c48fb4ca1b08b0f5ed59a4d5ecbf45e20a3' \
            "$SQLITE_HEADER"
          test "$(x86_64-w64-mingw32-ar -t "$SQLITE_ARCHIVE")" = "sqlite3.o"

          env \
            PKG_CONFIG_PATH="$(realpath depends/$HOST_TRIPLET/lib/pkgconfig):$PKG_CONFIG_PATH" \
            cmake -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$(realpath depends/$HOST_TRIPLET/toolchain.cmake)" \
              -DBUILD_CLI=OFF \
              -DBUILD_DAEMON=OFF \
              -DBUILD_GUI=OFF \
              -DBUILD_TX=OFF \
              -DBUILD_TESTS=ON \
              -DENABLE_CRASH_HOOKS=ON \
              -DENABLE_SQLITE_WALLET=ON \
              -DWITH_BDB=ON \
              -DWITH_QRENCODE=OFF \
              -DWITH_ZMQ=OFF \
              -DCLIENT_VERSION_IS_RELEASE=true \
              -DCMAKE_BUILD_TYPE=Release \
              -S"$(realpath .)" \
              -B"$(realpath build-windows-dual)"

          test ! -e "$PWD/src/config/bitcoin-config.h"
          test ! -L "$PWD/src/config/bitcoin-config.h"
          cmake -E compare_files \
            "$PWD/build-windows-dual/src/config/bitcoin-config.h" \
            "$PWD/build-windows-dual/config/bitcoin-config.h"
          grep -Fqx '#define USE_SQLITE 1' \
            "$PWD/build-windows-dual/src/config/bitcoin-config.h"
          cmake --build build-windows-dual \
            --target test_firo \
            --parallel "$EVIDENCE_JOBS"

          DUAL_AUDIT_DIR=$(mktemp -d)
          x86_64-w64-mingw32-ar -t \
            build-windows-dual/lib/libfiro_wallet.a \
            > "$DUAL_AUDIT_DIR/wallet-members"
          x86_64-w64-mingw32-nm -C \
            build-windows-dual/lib/libfiro_wallet.a \
            > "$DUAL_AUDIT_DIR/wallet-symbols"
          x86_64-w64-mingw32-objdump -p \
            build-windows-dual/bin/test_firo.exe \
            > "$DUAL_AUDIT_DIR/test-firo-pe"
          grep -Eiq 'sqlite\.cpp' \
            "$DUAL_AUDIT_DIR/wallet-members"
          grep -Eiq 'win32_file_lifecycle' \
            "$DUAL_AUDIT_DIR/wallet-members"
          grep -Eq \
            'sqlite3_|(^|[^[:alnum:]_])SQLite(Database|Batch)(::|\()|win32_wallet::' \
            "$DUAL_AUDIT_DIR/wallet-symbols"
          if grep -Eiq 'DLL Name:.*sqlite' \
              "$DUAL_AUDIT_DIR/test-firo-pe"; then
            echo "Dual Windows test executable imports SQLite dynamically"
            exit 1
          fi

      - name: Build true BDB-only wallet tests
        run: |
          set -exo pipefail
          HOST_TRIPLET=x86_64-w64-mingw32
          make -C depends -j"$EVIDENCE_JOBS" \
            HOST="$HOST_TRIPLET" \
            NO_QT=1 \
            NO_QR=1 \
            NO_ZMQ=1 \
            NO_SQLITE=1

          test ! -e "depends/$HOST_TRIPLET/include/sqlite3.h"
          test ! -e "depends/$HOST_TRIPLET/include/sqlite3ext.h"
          test ! -e "depends/$HOST_TRIPLET/lib/libsqlite3.a"
          test ! -e "depends/$HOST_TRIPLET/lib/pkgconfig/sqlite3.pc"

          env \
            PKG_CONFIG_PATH="$(realpath depends/$HOST_TRIPLET/lib/pkgconfig):$PKG_CONFIG_PATH" \
            cmake -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$(realpath depends/$HOST_TRIPLET/toolchain.cmake)" \
              -DBUILD_CLI=OFF \
              -DBUILD_DAEMON=OFF \
              -DBUILD_GUI=OFF \
              -DBUILD_TX=OFF \
              -DBUILD_TESTS=ON \
              -DENABLE_CRASH_HOOKS=ON \
              -DENABLE_SQLITE_WALLET=OFF \
              -DWITH_BDB=ON \
              -DWITH_QRENCODE=OFF \
              -DWITH_ZMQ=OFF \
              -DCLIENT_VERSION_IS_RELEASE=true \
              -DCMAKE_BUILD_TYPE=Release \
              -S"$(realpath .)" \
              -B"$(realpath build-windows-bdb-only)"

          test ! -e "$PWD/src/config/bitcoin-config.h"
          test ! -L "$PWD/src/config/bitcoin-config.h"
          cmake -E compare_files \
            "$PWD/build-windows-bdb-only/src/config/bitcoin-config.h" \
            "$PWD/build-windows-bdb-only/config/bitcoin-config.h"
          grep -Fqx '/* #undef USE_SQLITE */' \
            "$PWD/build-windows-bdb-only/src/config/bitcoin-config.h"
          cmake --build build-windows-bdb-only \
            --target test_firo \
            --parallel "$EVIDENCE_JOBS"

          BDB_AUDIT_DIR=$(mktemp -d)
          x86_64-w64-mingw32-ar -t \
            build-windows-bdb-only/lib/libfiro_wallet.a \
            > "$BDB_AUDIT_DIR/wallet-members"
          x86_64-w64-mingw32-nm -C \
            build-windows-bdb-only/lib/libfiro_wallet.a \
            > "$BDB_AUDIT_DIR/wallet-symbols"
          x86_64-w64-mingw32-objdump -p \
            build-windows-bdb-only/bin/test_firo.exe \
            > "$BDB_AUDIT_DIR/test-firo-pe"
          if grep -Eiq 'sqlite\.cpp|win32_file_lifecycle' \
              "$BDB_AUDIT_DIR/wallet-members"; then
            echo "BDB-only Windows wallet archive contains a SQLite wallet object"
            exit 1
          fi
          if grep -Eq \
              'sqlite3_|(^|[^[:alnum:]_])SQLite(Database|Batch)(::|\()|win32_wallet::' \
              "$BDB_AUDIT_DIR/wallet-symbols"; then
            echo "BDB-only Windows wallet archive contains a SQLite wallet symbol"
            exit 1
          fi
          if grep -Eiq 'DLL Name:.*sqlite' \
              "$BDB_AUDIT_DIR/test-firo-pe"; then
            echo "BDB-only Windows test executable imports SQLite"
            exit 1
          fi

      - name: Stage wallet test executables
        run: |
          set -exo pipefail
          mkdir -p \
            sqlite-wallet-platform-evidence/dual \
            sqlite-wallet-platform-evidence/bdb-only
          cp \
            build-windows-dual/bin/test_firo.exe \
            sqlite-wallet-platform-evidence/dual/test_firo.exe
          cp \
            build-windows-bdb-only/bin/test_firo.exe \
            sqlite-wallet-platform-evidence/bdb-only/test_firo.exe

      - name: Upload wallet test executables
        uses: actions/upload-artifact@v6
        with:
          name: sqlite-wallet-platform-evidence-${{ github.sha }}
          path: sqlite-wallet-platform-evidence
          if-no-files-found: error
          retention-days: 1

  run-native-windows-wallet-tests:
    name: Run SQLite wallet tests on native Windows NTFS
    needs: build-mingw-wallet-tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Download wallet test executables
        uses: actions/download-artifact@v7
        with:
          name: sqlite-wallet-platform-evidence-${{ github.sha }}
          path: wallet-tests

      - name: Run wallet database tests
        shell: pwsh
        working-directory: wallet-tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $testTemp = Join-Path $env:LOCALAPPDATA "FiroSQLiteWalletTests-$PID"
          New-Item -ItemType Directory -Path $testTemp | Out-Null
          $currentSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $identityBefore = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          try {
            $tokenOwnerBefore = $identityBefore.Owner
          } finally {
            $identityBefore.Dispose()
          }
          $tokenOwnerBeforeCategory = if (
            $null -ne $tokenOwnerBefore -and
            $tokenOwnerBefore.Equals($currentSid)
          ) {
            'current-user'
          } else {
            'non-current-user'
          }

          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.ComponentModel;
          using System.IO;
          using System.Runtime.InteropServices;
          using System.Security.Principal;
          using System.Text;
          using Microsoft.Win32.SafeHandles;

          public static class FiroTestTokenOwner
          {
              private const uint TOKEN_ADJUST_DEFAULT = 0x0080;
              private const int TOKEN_OWNER_CLASS = 4;

              [StructLayout(LayoutKind.Sequential)]
              private struct TokenOwner
              {
                  public IntPtr Owner;
              }

              [DllImport("kernel32.dll")]
              private static extern IntPtr GetCurrentProcess();

              [DllImport("advapi32.dll", SetLastError = true)]
              private static extern bool OpenProcessToken(
                  IntPtr process,
                  uint desiredAccess,
                  out SafeAccessTokenHandle token);

              [DllImport("advapi32.dll", SetLastError = true)]
              private static extern bool SetTokenInformation(
                  SafeAccessTokenHandle token,
                  int informationClass,
                  ref TokenOwner information,
                  int informationLength);

              public static void SetCurrentUserAsDefaultOwner()
              {
                  SafeAccessTokenHandle token;
                  if (!OpenProcessToken(
                          GetCurrentProcess(),
                          TOKEN_ADJUST_DEFAULT,
                          out token)) {
                      throw new Win32Exception(
                          Marshal.GetLastWin32Error(),
                          "OpenProcessToken(TOKEN_ADJUST_DEFAULT) failed");
                  }

                  using (token)
                  using (WindowsIdentity identity = WindowsIdentity.GetCurrent()) {
                      SecurityIdentifier user = identity.User;
                      if (user == null) {
                          throw new InvalidOperationException(
                              "The current process token has no user SID.");
                      }
                      byte[] userBytes = new byte[user.BinaryLength];
                      user.GetBinaryForm(userBytes, 0);
                      GCHandle pinnedUser = GCHandle.Alloc(
                          userBytes,
                          GCHandleType.Pinned);
                      try {
                          TokenOwner owner = new TokenOwner {
                              Owner = pinnedUser.AddrOfPinnedObject()
                          };
                          if (!SetTokenInformation(
                                  token,
                                  TOKEN_OWNER_CLASS,
                                  ref owner,
                                  Marshal.SizeOf(typeof(TokenOwner)))) {
                              throw new Win32Exception(
                                  Marshal.GetLastWin32Error(),
                                  "SetTokenInformation(TokenOwner) failed");
                          }
                      } finally {
                          pinnedUser.Free();
                      }
                  }
              }
          }

          public static class FiroMoveFileProbe
          {
              private const uint GENERIC_READ = 0x80000000;
              private const uint GENERIC_WRITE = 0x40000000;
              private const uint DELETE = 0x00010000;
              private const uint READ_CONTROL = 0x00020000;
              private const uint FILE_READ_ATTRIBUTES = 0x00000080;
              private const uint FILE_SHARE_READ = 0x00000001;
              private const uint FILE_SHARE_WRITE = 0x00000002;
              private const uint FILE_SHARE_DELETE = 0x00000004;
              private const uint OPEN_EXISTING = 3;
              private const uint FILE_ATTRIBUTE_NORMAL = 0x00000080;
              private const uint FILE_FLAG_OPEN_REPARSE_POINT = 0x00200000;
              private const uint FILE_FLAG_WRITE_THROUGH = 0x80000000;
              private const uint MOVEFILE_REPLACE_EXISTING = 0x00000001;
              private const uint MOVEFILE_WRITE_THROUGH = 0x00000008;
              private const int FILE_RENAME_INFO_EX = 22;
              private const uint FILE_RENAME_REPLACE_IF_EXISTS = 0x00000001;
              private const uint FILE_RENAME_POSIX_SEMANTICS = 0x00000002;
              private const int ERROR_FILE_NOT_FOUND = 2;
              private const int ERROR_PATH_NOT_FOUND = 3;

              [StructLayout(LayoutKind.Sequential)]
              private struct FileTime
              {
                  public uint Low;
                  public uint High;
              }

              [StructLayout(LayoutKind.Sequential)]
              private struct ByHandleFileInformation
              {
                  public uint Attributes;
                  public FileTime CreationTime;
                  public FileTime LastAccessTime;
                  public FileTime LastWriteTime;
                  public uint VolumeSerial;
                  public uint SizeHigh;
                  public uint SizeLow;
                  public uint LinkCount;
                  public uint FileIndexHigh;
                  public uint FileIndexLow;
              }

              [StructLayout(LayoutKind.Sequential)]
              private struct FileStandardInformation
              {
                  public long AllocationSize;
                  public long EndOfFile;
                  public uint LinkCount;
                  [MarshalAs(UnmanagedType.U1)]
                  public bool DeletePending;
                  [MarshalAs(UnmanagedType.U1)]
                  public bool Directory;
              }

              private struct Identity
              {
                  public bool Valid;
                  public uint Volume;
                  public ulong Index;
              }

              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              private static extern SafeFileHandle CreateFileW(
                  string path,
                  uint access,
                  uint share,
                  IntPtr security,
                  uint creation,
                  uint flags,
                  IntPtr template);

              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              private static extern bool MoveFileExW(
                  string existingPath,
                  string newPath,
                  uint flags);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool GetFileInformationByHandle(
                  SafeFileHandle file,
                  out ByHandleFileInformation information);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool GetFileInformationByHandleEx(
                  SafeFileHandle file,
                  int informationClass,
                  out FileStandardInformation information,
                  uint size);

              [DllImport("kernel32.dll", SetLastError = true)]
              private static extern bool SetFileInformationByHandle(
                  SafeFileHandle file,
                  int informationClass,
                  IntPtr information,
                  uint size);

              private static SafeFileHandle OpenRetained(
                  string path,
                  bool grantDelete,
                  bool writeThrough,
                  bool shareDelete)
              {
                  uint access =
                      GENERIC_READ |
                      GENERIC_WRITE |
                      FILE_READ_ATTRIBUTES |
                      READ_CONTROL;
                  if (grantDelete) {
                      access |= DELETE;
                  }
                  uint flags =
                      FILE_ATTRIBUTE_NORMAL |
                      FILE_FLAG_OPEN_REPARSE_POINT;
                  if (writeThrough) {
                      flags |= FILE_FLAG_WRITE_THROUGH;
                  }
                  uint share =
                      FILE_SHARE_READ |
                      FILE_SHARE_WRITE;
                  if (shareDelete) {
                      share |= FILE_SHARE_DELETE;
                  }
                  SafeFileHandle file = CreateFileW(
                      path,
                      access,
                      share,
                      IntPtr.Zero,
                      OPEN_EXISTING,
                      flags,
                      IntPtr.Zero);
                  if (file.IsInvalid) {
                      int error = Marshal.GetLastWin32Error();
                      file.Dispose();
                      throw new Win32Exception(error);
                  }
                  return file;
              }

              private static bool TryIdentity(
                  SafeFileHandle file,
                  out Identity identity,
                  out int error)
              {
                  identity = new Identity();
                  error = 0;
                  if (file == null || file.IsInvalid) {
                      return false;
                  }
                  ByHandleFileInformation information;
                  if (!GetFileInformationByHandle(
                          file,
                          out information)) {
                      error = Marshal.GetLastWin32Error();
                      return false;
                  }
                  identity.Valid = true;
                  identity.Volume = information.VolumeSerial;
                  identity.Index =
                      ((ulong)information.FileIndexHigh << 32) |
                      information.FileIndexLow;
                  return true;
              }

              private static bool TryPathIdentity(
                  string path,
                  out Identity identity,
                  out int error)
              {
                  identity = new Identity();
                  error = 0;
                  using (SafeFileHandle file = CreateFileW(
                      path,
                      FILE_READ_ATTRIBUTES,
                      FILE_SHARE_READ |
                          FILE_SHARE_WRITE |
                          FILE_SHARE_DELETE,
                      IntPtr.Zero,
                      OPEN_EXISTING,
                      FILE_ATTRIBUTE_NORMAL |
                          FILE_FLAG_OPEN_REPARSE_POINT,
                      IntPtr.Zero)) {
                      if (file.IsInvalid) {
                          error = Marshal.GetLastWin32Error();
                          return false;
                      }
                      return TryIdentity(
                          file,
                          out identity,
                          out error);
                  }
              }

              private static bool Same(
                  Identity first,
                  Identity second)
              {
                  return first.Valid &&
                      second.Valid &&
                      first.Volume == second.Volume &&
                      first.Index == second.Index;
              }

              private static string IdentityCategory(
                  Identity identity,
                  Identity source,
                  Identity destination)
              {
                  if (!identity.Valid) {
                      return "invalid";
                  }
                  if (Same(identity, source)) {
                      return "source";
                  }
                  if (Same(identity, destination)) {
                      return "destination";
                  }
                  return "other";
              }

              private static string PathCategory(
                  string path,
                  Identity source,
                  Identity destination)
              {
                  Identity identity;
                  int error;
                  if (TryPathIdentity(
                          path,
                          out identity,
                          out error)) {
                      return IdentityCategory(
                          identity,
                          source,
                          destination);
                  }
                  if (error == ERROR_FILE_NOT_FOUND ||
                      error == ERROR_PATH_NOT_FOUND) {
                      return "absent";
                  }
                  return "error-" + error;
              }

              private static string HandleCategory(
                  SafeFileHandle file,
                  Identity source,
                  Identity destination)
              {
                  if (file == null) {
                      return "none";
                  }
                  Identity identity;
                  int error;
                  if (!TryIdentity(
                          file,
                          out identity,
                          out error)) {
                      return "error-" + error;
                  }
                  return IdentityCategory(
                      identity,
                      source,
                      destination);
              }

              private static string DeletePending(
                  SafeFileHandle file)
              {
                  if (file == null) {
                      return "none";
                  }
                  FileStandardInformation information;
                  if (!GetFileInformationByHandleEx(
                          file,
                          1,
                          out information,
                          (uint)Marshal.SizeOf(
                              typeof(FileStandardInformation)))) {
                      return "error-" +
                          Marshal.GetLastWin32Error();
                  }
                  return information.DeletePending ?
                      "true" :
                      "false";
              }

              private static bool Equal(
                  byte[] first,
                  byte[] second)
              {
                  if (first.Length != second.Length) {
                      return false;
                  }
                  for (int index = 0;
                       index < first.Length;
                       ++index) {
                      if (first[index] != second[index]) {
                          return false;
                      }
                  }
                  return true;
              }

              private static string DestinationBytes(
                  string path,
                  byte[] source,
                  byte[] destination)
              {
                  if (!File.Exists(path)) {
                      return "absent";
                  }
                  byte[] contents = File.ReadAllBytes(path);
                  if (Equal(contents, source)) {
                      return "source";
                  }
                  if (Equal(contents, destination)) {
                      return "destination";
                  }
                  return "other";
              }

              private static bool RenamePosix(
                  SafeFileHandle source,
                  string destination,
                  out int error)
              {
                  byte[] name =
                      Encoding.Unicode.GetBytes(destination);
                  int rootOffset =
                      IntPtr.Size == 8 ? 8 : 4;
                  int lengthOffset =
                      rootOffset + IntPtr.Size;
                  int nameOffset =
                      lengthOffset + sizeof(uint);
                  int size =
                      nameOffset + name.Length;
                  IntPtr information =
                      Marshal.AllocHGlobal(size);
                  try {
                      for (int offset = 0;
                           offset < size;
                           ++offset) {
                          Marshal.WriteByte(
                              information,
                              offset,
                              0);
                      }
                      Marshal.WriteInt32(
                          information,
                          0,
                          (int)(
                              FILE_RENAME_REPLACE_IF_EXISTS |
                              FILE_RENAME_POSIX_SEMANTICS));
                      Marshal.WriteIntPtr(
                          information,
                          rootOffset,
                          IntPtr.Zero);
                      Marshal.WriteInt32(
                          information,
                          lengthOffset,
                          name.Length);
                      Marshal.Copy(
                          name,
                          0,
                          IntPtr.Add(
                              information,
                              nameOffset),
                          name.Length);
                      bool renamed =
                          SetFileInformationByHandle(
                              source,
                              FILE_RENAME_INFO_EX,
                              information,
                              (uint)size);
                      error = renamed ?
                          0 :
                          Marshal.GetLastWin32Error();
                      return renamed;
                  } finally {
                      Marshal.FreeHGlobal(information);
                  }
              }

              private static void TryDelete(string path)
              {
                  try {
                      if (File.Exists(path)) {
                          File.Delete(path);
                      }
                  } catch {
                  }
              }

              private static string RunScenario(
                  string directory,
                  string label,
                  bool replace,
                  bool holdSource,
                  bool holdDestination,
                  bool grantDelete,
                  bool posix,
                  bool blockDestinationDeleteShare)
              {
                  string nonce =
                      Guid.NewGuid().ToString("N");
                  string sourcePath =
                      Path.Combine(
                          directory,
                          "move-probe-" + nonce + "-source");
                  string destinationPath =
                      Path.Combine(
                          directory,
                          "move-probe-" + nonce + "-destination");
                  byte[] sourceBytes =
                      Encoding.ASCII.GetBytes(
                          "source-bytes");
                  byte[] destinationBytes =
                      Encoding.ASCII.GetBytes(
                          "destination-bytes");
                  SafeFileHandle sourceFile = null;
                  SafeFileHandle destinationFile = null;
                  try {
                      File.WriteAllBytes(
                          sourcePath,
                          sourceBytes);
                      if (replace) {
                          File.WriteAllBytes(
                              destinationPath,
                              destinationBytes);
                      }

                      Identity sourceIdentity;
                      Identity destinationIdentity;
                      int identityError;
                      if (!TryPathIdentity(
                              sourcePath,
                              out sourceIdentity,
                              out identityError)) {
                          return label +
                              "=source-identity-error-" +
                              identityError;
                      }
                      if (replace) {
                          if (!TryPathIdentity(
                                  destinationPath,
                                  out destinationIdentity,
                                  out identityError)) {
                              return label +
                                  "=destination-identity-error-" +
                                  identityError;
                          }
                      } else {
                          destinationIdentity =
                              new Identity();
                      }

                      if (holdSource || posix) {
                          sourceFile = OpenRetained(
                          sourcePath,
                          grantDelete || posix,
                          posix,
                          true);
                      }
                      if (holdDestination) {
                          destinationFile = OpenRetained(
                              destinationPath,
                              grantDelete,
                              false,
                              !blockDestinationDeleteShare);
                      }

                      int nativeError;
                      bool moved;
                      if (posix) {
                          moved = RenamePosix(
                              sourceFile,
                              destinationPath,
                              out nativeError);
                      } else {
                          moved = MoveFileExW(
                              sourcePath,
                              destinationPath,
                              MOVEFILE_WRITE_THROUGH |
                                  (replace ?
                                      MOVEFILE_REPLACE_EXISTING :
                                      0));
                          nativeError = moved ?
                              0 :
                              Marshal.GetLastWin32Error();
                      }

                      return label +
                          "=" +
                          (moved ?
                              "success" :
                              "failure") +
                          ",error=" +
                          nativeError +
                          ",source_path=" +
                          PathCategory(
                              sourcePath,
                              sourceIdentity,
                              destinationIdentity) +
                          ",destination_path=" +
                          PathCategory(
                              destinationPath,
                              sourceIdentity,
                              destinationIdentity) +
                          ",source_handle=" +
                          HandleCategory(
                              sourceFile,
                              sourceIdentity,
                              destinationIdentity) +
                          ",destination_handle=" +
                          HandleCategory(
                              destinationFile,
                              sourceIdentity,
                              destinationIdentity) +
                          ",destination_delete_pending=" +
                          DeletePending(
                              destinationFile) +
                          ",destination_bytes=" +
                          DestinationBytes(
                              destinationPath,
                              sourceBytes,
                              destinationBytes);
                  } catch (Win32Exception exception) {
                      return label +
                          "=probe-win32-error-" +
                          exception.NativeErrorCode;
                  } catch {
                      return label +
                          "=probe-exception";
                  } finally {
                      if (destinationFile != null) {
                          destinationFile.Dispose();
                      }
                      if (sourceFile != null) {
                          sourceFile.Dispose();
                      }
                      TryDelete(sourcePath);
                      TryDelete(destinationPath);
                  }
              }

              public static string Run(string directory)
              {
                  List<string> results =
                      new List<string>();
                  results.Add(
                      "current_access=0xC0020080,delete_access=0xC0030080," +
                      "current_share=0x7,blocker_share=0x3");
                  results.Add(RunScenario(
                      directory,
                      "noreplace_none",
                      false,
                      false,
                      false,
                      false,
                      false,
                      false));
                  results.Add(RunScenario(
                      directory,
                      "noreplace_source",
                      false,
                      true,
                      false,
                      false,
                      false,
                      false));
                  results.Add(RunScenario(
                      directory,
                      "noreplace_source_delete",
                      false,
                      true,
                      false,
                      true,
                      false,
                      false));
                  results.Add(RunScenario(
                      directory,
                      "replace_none",
                      true,
                      false,
                      false,
