            fi
          }
          trap cleanup_header_aid EXIT
          echo "::warning::Using the recorded generated-header aid; this is runtime evidence, not clean-build evidence."
          run_logged_phase \
            'BDB-only CMake build' \
            cmake --build build-mac-bdb-only \
              --target test_firo \
              --parallel "$EVIDENCE_JOBS"
          PRETEST_PHASE='remove BDB-only generated-header aid'
          cleanup_header_aid
          trap - EXIT

          PRETEST_PHASE='audit BDB-only absence of SQLite linkage'
          BDB_AUDIT_DIR=$(mktemp -d)
          ar -t build-mac-bdb-only/lib/libfiro_wallet.a \
