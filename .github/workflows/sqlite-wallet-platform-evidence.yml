          nm -C build-mac-bdb-only/lib/libfiro_wallet.a \
            > "$BDB_AUDIT_DIR/wallet-symbols"
          otool -L build-mac-bdb-only/bin/test_firo \
            > "$BDB_AUDIT_DIR/test-firo-libraries"
          if grep -Eiq 'sqlite\.cpp|win32_file_lifecycle' \
